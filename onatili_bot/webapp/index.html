<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ona tili · Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;700&family=Caveat:wght@500;700&family=Russo+One&family=Archivo+Black&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root {
  /* Ilova: Telegram mavzusi ranglari + bitta yashil urg'u ("imtihon varaqasi"). Kartalar, doirachali javob varaqasi */
  --bg: var(--tg-theme-secondary-bg-color, #f1f4f2);
  --surface: var(--tg-theme-bg-color, #ffffff);
  --ink: var(--tg-theme-text-color, #18211c);
  --muted: var(--tg-theme-hint-color, #6b7871);
  --accent: #1d7a48;
  --accent-ink: #ffffff;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  --line: color-mix(in srgb, var(--muted) 22%, transparent);
  --good: #1f9d55; --warn: #d4a017; --bad: #d64545;
  --radius: 18px;
  --font-display: "Unbounded", "Onest", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html.dark { --accent: #3fbf78; --accent-ink: #06150d; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.45; }
button { font: inherit; color: inherit; }
input, textarea { font: inherit; color: var(--ink); }
#app { max-width: 640px; margin: 0 auto; padding: 14px 16px calc(96px + var(--safe-bottom)); }
.view { animation: viewIn .35s cubic-bezier(.2,.8,.2,1); display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.view > *, .card > *, .list > * { min-width: 0; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }
h1 { font-family: var(--font-display); font-size: 24px; line-height: 1.15; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 17px; margin: 0; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.hero { display: grid; gap: 6px; padding: 6px 2px 2px; }
.hero .hi { font-size: 14px; color: var(--muted); }
.brand { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.brand i { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: inline-grid; place-items: center; color: var(--accent-ink); font-style: normal; font-size: 12px; font-family: var(--font-display); }

/* Tugmalar */
.btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; justify-content: center; transition: transform .12s, filter .2s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.plain { background: transparent; color: var(--accent); padding: 8px 10px; }
.btn.danger { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.btn.sm { padding: 9px 12px; font-size: 14px; border-radius: 12px; }
.btn:focus-visible, .chip:focus-visible, .bubble:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sticky-bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + var(--safe-bottom)); background: linear-gradient(transparent, var(--bg) 30%); z-index: 20; }
.sticky-bottom > div { max-width: 640px; margin: 0 auto; }

/* Segment */
.segment { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 14px; padding: 4px; position: relative; }
.segment button { border: 0; background: transparent; padding: 10px; border-radius: 11px; font-weight: 600; cursor: pointer; position: relative; z-index: 1; transition: color .25s; color: var(--muted); }
.segment button.on { color: var(--accent-ink); }
.segment .pill { position: absolute; top: 4px; bottom: 4px; width: calc(50% - 4px); left: 4px; background: var(--accent); border-radius: 11px; transition: transform .35s cubic-bezier(.3,1.3,.5,1); }
.segment.right .pill { transform: translateX(100%); }

/* Kod kiritish */
.code-input { width: 100%; text-align: center; font-family: var(--font-display); font-size: 30px; letter-spacing: .4em; padding: 14px 8px 14px calc(8px + .4em); border-radius: 14px; border: 2px solid var(--line); background: var(--bg); transition: border-color .2s; }
.code-input:focus { border-color: var(--accent); outline: none; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); font-size: 16px; transition: border-color .2s; }
.input:focus { border-color: var(--accent); outline: none; }
textarea.input { min-height: 120px; resize: vertical; line-height: 1.5; }

/* Ro'yxat */
.list { display: grid; gap: 8px; }
.item { background: var(--surface); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; cursor: pointer; transition: transform .15s; border: 0; text-align: left; width: 100%; }
.item:active { transform: scale(.985); }
.item .ico { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; background: var(--accent-soft); }
.item b { display: block; font-size: 15.5px; line-height: 1.25; }
.item small { color: var(--muted); font-size: 12.5px; }
.pill-tag { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 99px; white-space: nowrap; }
.pill-tag.wait { background: color-mix(in srgb, var(--warn) 18%, transparent); color: color-mix(in srgb, var(--warn) 80%, var(--ink)); }
.pill-tag.done { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty .big { font-size: 40px; }

/* Javob varaqasi: doirachalar */
.sheet-progress { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 8px 0 6px; display: grid; gap: 6px; }
.track { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .3s cubic-bezier(.2,.8,.2,1); }
.qrow { display: grid; grid-template-columns: 34px 1fr; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.qrow:last-child { border-bottom: 0; }
.qnum { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.qrow.done .qnum { color: var(--accent); }
.bubbles { display: flex; gap: 8px; flex-wrap: wrap; }
.bubble { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: transparent; font-weight: 700; font-size: 14px; display: grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s, color .15s, transform .15s; }
.bubble.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); animation: pick .3s cubic-bezier(.3,1.6,.5,1); }
@keyframes pick { 50% { transform: scale(1.18); } }
.section-title { display: flex; justify-content: space-between; align-items: baseline; }
.textq { display: grid; grid-template-columns: 42px 1fr; gap: 8px; align-items: center; }
.textq b { color: var(--muted); font-size: 14px; }
.wkey { display: grid; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.wkey:last-of-type { border-bottom: 0; }
.syn-list { display: grid; gap: 6px; padding-left: 50px; }
.syn-list:not(:empty) { margin-top: 6px; }
.syn-row { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; animation: viewIn .25s cubic-bezier(.2,.8,.2,1); }
.syn-row .input { padding: 9px 12px; font-size: 15px; border-style: dashed; }
.syn-del { border: 0; background: transparent; color: var(--muted); font-size: 15px; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; }
.syn-del:active { background: var(--accent-soft); }
.syn-add { justify-self: start; margin: 4px 0 2px 50px; border: 0; background: transparent; color: var(--accent); font: 600 13.5px var(--font-body); padding: 6px 8px; border-radius: 10px; cursor: pointer; }
.syn-add:active { background: var(--accent-soft); }
.syn-add[hidden] { display: none; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.topic { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-style: italic; }
.counter { font-size: 12.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* Statistika */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: 16px; padding: 14px; display: grid; gap: 2px; }
.tile b { font-family: var(--font-display); font-size: 24px; color: var(--accent); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12.5px; color: var(--muted); }
.gradebar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--line); }
.gradebar i { display: block; height: 100%; animation: growx .9s cubic-bezier(.2,.8,.2,1) backwards; }
@keyframes growx { from { width: 0 !important; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: var(--surface); border-radius: 99px; padding: 9px 14px; font-weight: 600; white-space: nowrap; cursor: pointer; color: var(--muted); }
.tabs button.on { background: var(--ink); color: var(--surface); }
.heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
.heat div { border-radius: 10px; padding: 7px 4px; text-align: center; font-size: 12px; line-height: 1.2; animation: viewIn .4s backwards; }
.heat b { display: block; font-size: 13px; }
.h-good { background: color-mix(in srgb, var(--good) 22%, transparent); }
.h-mid { background: color-mix(in srgb, var(--warn) 25%, transparent); }
.h-bad { background: color-mix(in srgb, var(--bad) 22%, transparent); }
.people .item { grid-template-columns: 30px 1fr auto; }
.rank { font-family: var(--font-display); font-size: 15px; color: var(--muted); text-align: center; }
.grade-chip { font-family: var(--font-display); font-size: 13px; padding: 5px 9px; border-radius: 9px; color: #fff; min-width: 38px; text-align: center; }
.score-col { text-align: right; display: grid; gap: 3px; justify-items: end; }
.score-col b { font-variant-numeric: tabular-nums; }

/* Natija tahlili */
.review { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 6px; }
.rv { border-radius: 10px; padding: 6px; font-size: 12.5px; text-align: center; line-height: 1.25; }
.rv b { display: block; }
.rv.ok { background: color-mix(in srgb, var(--good) 18%, transparent); }
.rv.no { background: color-mix(in srgb, var(--bad) 16%, transparent); }
.wr { display: grid; gap: 2px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.wr:last-child { border-bottom: 0; }
.crit { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.crit:last-child { border-bottom: 0; }
.crit p { grid-column: 1 / -1; margin: 0; font-size: 13.5px; color: var(--muted); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }

/* Dizayn tanlash */
.themes { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.themes::-webkit-scrollbar { display: none; }
.swatch { flex: 0 0 auto; width: 92px; border: 2px solid transparent; border-radius: 14px; padding: 6px; background: var(--bg); cursor: pointer; display: grid; gap: 6px; scroll-snap-align: start; text-align: left; }
.swatch.on { border-color: var(--accent); }
.swatch .sw { height: 54px; border-radius: 10px; position: relative; overflow: hidden; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.swatch span { font-size: 11.5px; font-weight: 600; line-height: 1.2; }

/* Muvaffaqiyat */
.success { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 30px 10px; }
.check { width: 92px; height: 92px; }
.check circle { fill: none; stroke: var(--accent); stroke-width: 6; stroke-dasharray: 276; stroke-dashoffset: 276; animation: draw .7s ease-out forwards; }
.check path { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw .45s .55s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.bigcode { font-family: var(--font-display); font-size: 40px; letter-spacing: .18em; color: var(--accent); }

/* Bildirishnoma va yuklanish */
.toast { position: fixed; left: 50%; bottom: calc(90px + var(--safe-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: var(--surface); padding: 11px 16px; border-radius: 14px; font-size: 14px; font-weight: 500; opacity: 0; transition: all .3s cubic-bezier(.2,.8,.2,1); z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.skeleton { border-radius: 16px; background: linear-gradient(90deg, var(--surface) 25%, color-mix(in srgb, var(--surface) 70%, var(--line)) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; height: 72px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.sheet-modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: flex; align-items: flex-end; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet-modal > div { background: var(--surface); width: 100%; max-width: 640px; margin: 0 auto; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + var(--safe-bottom)); max-height: 88vh; overflow-y: auto; display: grid; gap: 12px; animation: up .3s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(40px); opacity: .5; } }

/* ---------- Natija kartasi (20 dizayn) ---------- */
.rcard { --r: 22px; --ring: 108px; position: relative; isolation: isolate; overflow: hidden; background: var(--bg-c); color: var(--fg); font-family: var(--font); border-radius: var(--r); padding: 20px 20px 16px; display: grid; gap: 14px; box-shadow: 0 14px 34px rgba(16, 30, 22, .16); }
.rcard .pattern { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.rcard .c-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--mu); }
.rcard .who { display: grid; gap: 2px; }
.rcard .who small { color: var(--mu); font-size: 12px; }
.rcard .who b { font-family: var(--dfont); font-size: 22px; line-height: 1.15; }
.rcard .score { display: grid; grid-template-columns: var(--ring) 1fr; gap: 16px; align-items: center; }
.rcard .ring { position: relative; width: var(--ring); height: var(--ring); }
.rcard .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.rcard .ring .tr { fill: none; stroke: var(--track); stroke-width: 9; }
.rcard .ring .pr { fill: none; stroke: var(--a); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 276.46; stroke-dashoffset: var(--off); animation: ring 1.6s cubic-bezier(.2,.8,.2,1) .25s backwards; }
.rcard .ring .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.rcard .num { font-family: var(--dfont); font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.rcard .of { font-size: 10.5px; color: var(--mu); margin-top: 3px; }
.rcard .grade { display: grid; gap: 2px; justify-items: start; }
.rcard .grade span { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--mu); }
.rcard .grade b { font-family: var(--dfont); font-size: 50px; line-height: .95; color: var(--a); animation: pop .6s cubic-bezier(.3,1.6,.5,1) 1.1s backwards; }
.rcard .grade small { font-size: 12.5px; color: var(--mu); }
.rcard .bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rcard .bars li { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 13px; }
.rcard .bars li b { font-variant-numeric: tabular-nums; }
.rcard .bars i { grid-column: 1 / -1; height: 7px; border-radius: 99px; background: var(--track); overflow: hidden; display: block; }
.rcard .bars i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--b); border-radius: inherit; animation: grow 1.2s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: var(--d); }
.rcard .c-foot { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--mu); border-top: 1px dashed color-mix(in srgb, var(--mu) 45%, transparent); padding-top: 10px; }
@keyframes ring { from { stroke-dashoffset: 276.46; } }
@keyframes grow { from { width: 0; } }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.rcard > *:not(.pattern) { animation: rise .6s cubic-bezier(.2,.8,.2,1) backwards; }
.rcard > .who { animation-delay: .05s; } .rcard > .score { animation-delay: .1s; } .rcard > .bars { animation-delay: .15s; }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.t-diploma { --r: 6px; text-align: center; border: 2px solid var(--a); box-shadow: inset 0 0 0 6px var(--bg-c), inset 0 0 0 7px var(--a), 0 14px 34px rgba(60,40,10,.18); }
.t-diploma .c-head { justify-content: center; gap: 10px; } .t-diploma .c-head::before, .t-diploma .c-head::after { content: "❦"; letter-spacing: 0; font-size: 14px; color: var(--a); } .t-diploma .c-head .no { display: none; }
.t-diploma .score { grid-template-columns: 1fr; justify-items: center; } .t-diploma .grade { justify-items: center; } .t-diploma .who b { font-size: 26px; font-style: italic; }
.t-ikat .pattern { background: linear-gradient(var(--bg-c), var(--bg-c)) 0 64px / 100% 100% no-repeat, repeating-linear-gradient(90deg, #e2216f 0 18px, #ffcf3f 18px 30px, #2d1e8f 30px 52px, #ffcf3f 52px 64px, #12a5a0 64px 84px); }
.t-ikat .c-head { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); margin-bottom: 26px; }
.t-tiles { padding: 32px 30px 26px; } .t-tiles .pattern { background: linear-gradient(var(--bg-c), var(--bg-c)) 14px 14px / calc(100% - 28px) calc(100% - 28px) no-repeat, conic-gradient(from 45deg, #0e5a8a 25%, #39b5c4 0 50%, #0e5a8a 0 75%, #f2c14e 0) 0 0 / 28px 28px; }
.t-neon .who b, .t-neon .grade b, .t-neon .num { text-shadow: 0 0 10px var(--a), 0 0 24px var(--a); } .t-neon .ring svg { filter: drop-shadow(0 0 6px var(--a)); }
.t-neon .grade b { animation: pop .6s cubic-bezier(.3,1.6,.5,1) 1.1s backwards, flicker 3.2s linear 2s infinite; }
.t-neon .pattern { background: radial-gradient(circle at 80% 0%, color-mix(in srgb, var(--a) 30%, transparent), transparent 55%), radial-gradient(circle at 0% 100%, color-mix(in srgb, var(--b) 25%, transparent), transparent 50%); }
@keyframes flicker { 0%, 18%, 22%, 60%, 64%, 100% { opacity: 1; } 20%, 62% { opacity: .55; } }
.t-terminal { --r: 10px; } .t-terminal .pattern { background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
.t-terminal .who b::after { content: "▌"; margin-left: 4px; animation: blink 1s steps(1) infinite; color: var(--a); } .t-terminal .ring .pr { stroke-linecap: butt; } .t-terminal .ring .tr { stroke-dasharray: 3 3; }
.t-terminal .bars i, .t-terminal .bars i::after { border-radius: 0; }
@keyframes blink { 50% { opacity: 0; } }
.t-brutal { --r: 0; border: 3px solid #111; box-shadow: 8px 8px 0 #111; } .t-brutal .bars i { border: 2px solid #111; border-radius: 0; height: 12px; } .t-brutal .bars i::after { border-radius: 0; }
.t-brutal .grade b { background: #111; color: var(--bg-c); padding: 2px 10px 6px; } .t-brutal .ring .pr { stroke-linecap: butt; }

.t-space .pattern { background: radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 15%, #fff, transparent), radial-gradient(1.5px 1.5px at 85% 60%, #fff, transparent), radial-gradient(1px 1px at 40% 80%, #fff, transparent), radial-gradient(1px 1px at 10% 70%, #fff, transparent), radial-gradient(1.5px 1.5px at 55% 45%, #cbb8ff, transparent), radial-gradient(circle at 100% 0, rgba(140,90,255,.45), transparent 55%), #0d0a24; animation: twinkle 4s ease-in-out infinite alternate; }
@keyframes twinkle { to { filter: brightness(1.35); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const $app = document.getElementById("app");
const GRADE_COLORS = { "A+": "#0f5132", "A": "#1d6f42", "B+": "#2e8b57", "B": "#5a9e3a", "C+": "#b08900", "C": "#c77c02", "NC": "#9b2c2c" };
const GRADE_ORDER = ["A+", "A", "B+", "B", "C+", "C", "NC"];
const THEMES = {
  classic:   ["Klassik", { "bg-c": "#ffffff", fg: "#1f2933", mu: "#5d6b66", a: "#1d6f42", b: "#2e9b5f", track: "#e3efe7", font: "'Onest', sans-serif", dfont: "'Unbounded', sans-serif" }],
  diploma:   ["Diplom", { "bg-c": "#fbf6e9", fg: "#3b2f1c", mu: "#8a7550", a: "#a8801f", b: "#c9a446", track: "#efe4c6", font: "'Cormorant Garamond', serif", dfont: "'Cormorant Garamond', serif" }],
  ikat:      ["Atlas", { "bg-c": "#fff8f0", fg: "#2b1838", mu: "#7a6380", a: "#c4186a", b: "#2d1e8f", track: "#f1e3ee", font: "'Onest', sans-serif", dfont: "'Unbounded', sans-serif" }],
  tiles:     ["Registon", { "bg-c": "#fbfaf5", fg: "#10344f", mu: "#5d7486", a: "#0e5a8a", b: "#2aa7b8", track: "#e1eef3", font: "'Onest', sans-serif", dfont: "'Playfair Display', serif" }],
  neon:      ["Neon", { "bg-c": "#0b0b1a", fg: "#f2f0ff", mu: "#9b97c2", a: "#29e6ff", b: "#ff3fd1", track: "#22223d", font: "'Onest', sans-serif", dfont: "'Russo One', sans-serif" }],
  terminal:  ["Terminal", { "bg-c": "#06120b", fg: "#b8ffcf", mu: "#5fa77a", a: "#39ff88", b: "#39ff88", track: "#11301e", font: "'JetBrains Mono', monospace", dfont: "'JetBrains Mono', monospace" }],
  brutal:    ["Brutal", { "bg-c": "#ffe14d", fg: "#111111", mu: "#4a4320", a: "#111111", b: "#ff5a36", track: "#fff3b0", font: "'Onest', sans-serif", dfont: "'Archivo Black', sans-serif" }],
  glass:     ["Shisha", { "bg-c": "#2a2350", fg: "#ffffff", mu: "#d9d4ff", a: "#ffffff", b: "#3fe0c5", track: "rgba(255,255,255,.22)", font: "'Onest', sans-serif", dfont: "'Unbounded', sans-serif" }],
  chalk:     ["Bo'r doska", { "bg-c": "#21412f", fg: "#f4f4ec", mu: "#b7c9bc", a: "#ffe680", b: "#f4f4ec", track: "rgba(255,255,255,.15)", font: "'Caveat', cursive", dfont: "'Caveat', cursive" }],
  newspaper: ["Gazeta", { "bg-c": "#f4f1ea", fg: "#151515", mu: "#5b5750", a: "#151515", b: "#151515", track: "#e2ddd2", font: "'Cormorant Garamond', serif", dfont: "'Playfair Display', serif" }],
  bauhaus:   ["Bauhaus", { "bg-c": "#f6f1e7", fg: "#141414", mu: "#5a554b", a: "#e63b2e", b: "#1f4fbf", track: "#e6dfd0", font: "'Onest', sans-serif", dfont: "'Archivo Black', sans-serif" }],
  pastel:    ["Pastel", { "bg-c": "#fbfbff", fg: "#2f3048", mu: "#7a7b98", a: "#7c6cf0", b: "#4ccf9a", track: "#ecebfb", font: "'Onest', sans-serif", dfont: "'Unbounded', sans-serif" }],
  ocean:     ["Okean", { "bg-c": "#0b3a66", fg: "#ffffff", mu: "#b5d6e8", a: "#7ff0e0", b: "#ffd166", track: "rgba(255,255,255,.18)", font: "'Onest', sans-serif", dfont: "'Unbounded', sans-serif" }],
  autumn:    ["Kuzgi", { "bg-c": "#fff6ec", fg: "#3a2414", mu: "#8a6a52", a: "#c4561d", b: "#e8a33b", track: "#f6e3cf", font: "'Onest', sans-serif", dfont: "'Playfair Display', serif" }],
  minimal:   ["Minimal", { "bg-c": "#ffffff", fg: "#111111", mu: "#777777", a: "#111111", b: "#111111", track: "#e9e9e9", font: "'Onest', sans-serif", dfont: "'Onest', sans-serif" }],
  luxe:      ["Qora oltin", { "bg-c": "#0f0e0c", fg: "#f3ead6", mu: "#a8987a", a: "#d4ad57", b: "#d4ad57", track: "#2a261f", font: "'Onest', sans-serif", dfont: "'Cormorant Garamond', serif" }],
  sakura:    ["Sakura", { "bg-c": "#fffafc", fg: "#4a2433", mu: "#a07688", a: "#e0457b", b: "#f59ab8", track: "#fbe4ec", font: "'Onest', sans-serif", dfont: "'Playfair Display', serif" }],
  sport:     ["Sport", { "bg-c": "#141414", fg: "#ffffff", mu: "#a5a5a5", a: "#ff3b30", b: "#ffffff", track: "#2c2c2c", font: "'Onest', sans-serif", dfont: "'Russo One', sans-serif" }],
  paper:     ["Kitob", { "bg-c": "#f7eed7", fg: "#3d2d14", mu: "#86704a", a: "#8b3a1e", b: "#a8763a", track: "#eadbb6", font: "'Cormorant Garamond', serif", dfont: "'Cormorant Garamond', serif" }],
  space:     ["Kosmos", { "bg-c": "#0d0a24", fg: "#f1edff", mu: "#a59fd0", a: "#b69bff", b: "#5ee7ff", track: "rgba(255,255,255,.14)", font: "'Onest', sans-serif", dfont: "'Unbounded', sans-serif" }],
};

// ---------- Yordamchilar ----------
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = n => n == null ? "—" : (Math.round(n * 10) / 10).toString().replace(".", ",");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function haptic(kind = "light") { try { kind === "select" ? tg.HapticFeedback.selectionChanged() : ["success", "error", "warning"].includes(kind) ? tg.HapticFeedback.notificationOccurred(kind) : tg.HapticFeedback.impactOccurred(kind); } catch (e) {} }
let toastTimer;
function toast(text) { const t = document.getElementById("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600); }
function confirmBox(text) { return new Promise(res => { if (tg && tg.showConfirm) { try { tg.showConfirm(text, ok => res(!!ok)); return; } catch (e) {} } res(window.confirm(text)); }); }
function store(key, value) { try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; } }

async function api(path, data) {
  const opts = { headers: { "X-Init-Data": (tg && tg.initData) || "" } };
  if (data !== undefined) { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(data); }
  let res;
  try { res = await fetch(path, opts); } catch (e) { throw new Error("Internet aloqasi yo'q"); }
  const json = await res.json().catch(() => ({}));
  if (res.status === 403 && json.subscribe) {  // majburiy obuna — kanallar ekraniga
    S.boot = { subscribe: json.subscribe, user: (S.boot && S.boot.user) || { name: "" } };
    S.stack = []; S.current = { view: "home", params: {} }; render();
    throw new Error(json.error);
  }
  if (!res.ok) throw new Error(json.error || "Xatolik yuz berdi");
  return json;
}

function countUp(root = document) {
  root.querySelectorAll("[data-count]").forEach(el => {
    const to = parseFloat(el.dataset.count), suffix = el.dataset.suffix || "";
    if (reduceMotion || isNaN(to)) { el.textContent = num(to) + suffix; return; }
    const start = performance.now(), dur = 1300, delay = +el.dataset.delay || 200;
    (function frame(now) {
      const p = Math.min(1, Math.max(0, (now - start - delay) / dur));
      el.textContent = num(to * (1 - Math.pow(1 - p, 3))) + suffix;
      if (p < 1) requestAnimationFrame(frame);
    })(start);
  });
}

// ---------- Navigatsiya ----------
const S = { boot: null, stack: [], role: store("role") || "student" };
function go(view, params = {}, replace = false) {
  if (!replace && S.current) S.stack.push(S.current);
  S.current = { view, params };
  render();
}
function back() { if (S.stack.length) { S.current = S.stack.pop(); render(); } else { go("home", {}, true); } }
function render() {
  window.scrollTo(0, 0);
  const { view, params } = S.current;
  try {
    if (S.stack.length) { tg && tg.BackButton.show(); } else { tg && tg.BackButton.hide(); }
  } catch (e) {}
  (VIEWS[view] || VIEWS.home)(params);
}
if (tg) { try { tg.BackButton.onClick(back); } catch (e) {} }
function loading() { $app.innerHTML = `<div class="view"><div class="skeleton" style="height:40px;width:60%"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>`; }
function fail(error) {
  $app.innerHTML = `<div class="view"><div class="card empty"><div class="big">😕</div><b>${esc(error.message || error)}</b><button class="btn ghost" id="retry">Qayta urinish</button></div></div>`;
  document.getElementById("retry").onclick = () => render();
}

// ---------- Natija kartasi ----------
function resultCard(theme, d) {
  const [, v] = THEMES[theme] || THEMES.classic;
  const vars = Object.entries(v).map(([k, val]) => `--${k}:${val}`).join(";");
  const share = d.max ? Math.max(0, Math.min(1, d.value / d.max)) : 0;
  const bars = d.parts.map(([label, got, all], j) => `<li><span>${esc(label)}</span><b>${got == null ? "—" : num(got)} / ${all}</b><i style="--w:${got == null ? 0 : (got / all * 100).toFixed(1)}%;--d:${.35 + j * .15}s"></i></li>`).join("");
  return `<div class="rcard t-${theme}" style="${vars};--off:${(276.46 * (1 - share)).toFixed(1)}">
    <div class="pattern"></div>
    <div class="c-head"><span class="brand-c">Ona tili · ${esc(d.kind)}</span><span class="no">${esc(d.code)}</span></div>
    <div class="who"><small>O'quvchi</small><b>${esc(d.name)}</b><small>${esc(d.sub)}</small></div>
    <div class="score">
      <div class="ring"><svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="44"/><circle class="pr" cx="50" cy="50" r="44"/></svg>
        <div class="val"><span class="num" data-count="${d.value}" data-suffix="${d.suffix || ""}">${num(d.value)}${d.suffix || ""}</span><span class="of">${esc(d.of)}</span></div></div>
      <div class="grade"><span>${esc(d.gradeLabel)}</span><b>${esc(d.grade)}</b><small>${esc(d.gradeSub || "")}</small></div>
    </div>
    <ul class="bars">${bars}</ul>
    <div class="c-foot"><span>${esc(d.footLeft)}</span><span>${esc(d.footRight)}</span></div>
  </div>`;
}
function schoolGrade(p) { return p >= 86 ? "5" : p >= 71 ? "4" : p >= 56 ? "3" : "2"; }

function themePicker(selected, onPick) {
  const html = Object.entries(THEMES).map(([id, [name, v]]) =>
    `<button class="swatch ${id === selected ? "on" : ""}" data-theme="${id}" type="button" aria-label="${esc(name)}">
      <div class="sw" style="background:${v["bg-c"]};color:${v.a};font-family:${v.dfont}">B+</div><span>${esc(name)}</span></button>`).join("");
  setTimeout(() => {
    document.querySelectorAll(".swatch").forEach(b => b.onclick = () => {
      document.querySelectorAll(".swatch").forEach(x => x.classList.toggle("on", x === b));
      haptic("select"); onPick(b.dataset.theme);
    });
    const on = document.querySelector(".swatch.on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
  });
  return `<div class="themes">${html}</div>`;
}

// ---------- Doirachali varaq ----------
function bubbleSheet(items, answers, opts = {}) {
  const rows = items.filter(i => i.kind === "choice").map(i => {
    const letters = "ABCDEF".slice(0, i.options).split("");
    return `<div class="qrow ${answers[i.label] ? "done" : ""}" data-q="${i.label}"><span class="qnum">${i.label}</span><div class="bubbles">${letters.map(l =>
      `<button type="button" class="bubble ${answers[i.label] === l ? "on" : ""}" data-q="${i.label}" data-l="${l}" aria-label="${i.label}-savol ${l}">${l}</button>`).join("")}</div></div>`;
  }).join("");
  return `<div class="card" id="sheet">${rows}</div>`;
}
function bindBubbles(answers, onChange) {
  document.getElementById("sheet").addEventListener("click", e => {
    const b = e.target.closest(".bubble"); if (!b) return;
    const q = b.dataset.q, l = b.dataset.l;
    answers[q] = answers[q] === l ? undefined : l;
    if (!answers[q]) delete answers[q];
    const row = b.closest(".qrow");
    row.querySelectorAll(".bubble").forEach(x => x.classList.toggle("on", x.dataset.l === answers[q]));
    row.classList.toggle("done", !!answers[q]);
    haptic("select"); onChange && onChange();
  });
}

// ---------- Ko'rinishlar ----------
const VIEWS = {};

VIEWS.home = async () => {
  if (!S.boot) { loading(); try { S.boot = await api("/api/bootstrap"); } catch (e) { return fail(e); } }
  if (S.boot.subscribe) return subscribeGate(S.boot.subscribe);
  const b = S.boot, role = S.role;
  const first = (b.user.name || "").split(" ")[0];
  const attempts = b.attempts.map(a => `<button class="item" data-attempt="${a.id}" data-announced="${a.announced ? 1 : 0}">
      <span class="ico">${a.announced ? "📊" : "⏳"}</span>
      <span><b>${esc(a.title)}</b><small>Kod ${a.code} · ${esc(a.created_at)}</small></span>
      <span class="pill-tag ${a.announced ? "done" : "wait"}">${a.announced ? "Natija tayyor" : "Kutilmoqda"}</span></button>`).join("");
  const tests = b.tests.map(t => `<button class="item" data-test="${t.id}">
      <span class="ico">${t.closed ? "📢" : "📝"}</span>
      <span><b>${esc(t.title)}</b><small>Kod ${t.code} · 👥 ${t.students}${t.avg != null ? ` · o'rtacha ${num(t.avg)}` : ""}</small></span>
      <span class="pill-tag ${t.closed ? "done" : "wait"}">${t.closed ? "E'lon qilingan" : "Javob yig'ilmoqda"}</span></button>`).join("");
  $app.innerHTML = `<div class="view">
    <div class="hero"><span class="brand"><i>O</i>Ona tili · Mock</span><span class="hi">Salom, ${esc(first)} 👋</span>
      <h1>${role === "student" ? "Testni yeching, natijani kuting" : "Testlar va natijalar"}</h1></div>
    <div class="segment ${role === "teacher" ? "right" : ""}"><span class="pill"></span>
      <button class="${role === "student" ? "on" : ""}" data-role="student">🎓 O'quvchi</button>
      <button class="${role === "teacher" ? "on" : ""}" data-role="teacher">👩‍🏫 O'qituvchi</button></div>
    ${role === "student" ? `
      <div class="card"><h2>Test kodi</h2>
        <input class="code-input" id="code" inputmode="numeric" maxlength="5" placeholder="•••••" autocomplete="off" aria-label="Test kodi">
        <button class="btn block" id="start" disabled>Boshlash →</button></div>
      <div class="section-title"><h2>Mening testlarim</h2><span class="muted small">${b.attempts.length} ta</span></div>
      <div class="list">${attempts || `<div class="card empty"><div class="big">📭</div>Hali test topshirmagansiz.<br>O'qituvchingiz bergan kodni kiriting.</div>`}</div>`
    : `
      <button class="btn block" id="new">＋ Yangi test yaratish</button>
      <div class="section-title"><h2>Testlarim</h2><span class="muted small">${b.tests.length} ta</span></div>
      <div class="list">${tests || `<div class="card empty"><div class="big">🗂</div>Hali test yaratmagansiz.</div>`}</div>`}
  </div>`;
  document.querySelectorAll("[data-role]").forEach(x => x.onclick = () => { S.role = x.dataset.role; store("role", S.role); haptic("select"); render(); });
  const code = document.getElementById("code");
  if (code) {
    const start = document.getElementById("start");
    code.oninput = () => { code.value = code.value.replace(/\D/g, "").slice(0, 5); start.disabled = code.value.length !== 5; if (code.value.length === 5) start.focus(); };
    start.onclick = () => go("answer", { code: code.value });
    code.onkeydown = e => { if (e.key === "Enter" && code.value.length === 5) go("answer", { code: code.value }); };
  }
  document.querySelectorAll("[data-attempt]").forEach(x => x.onclick = () => x.dataset.announced === "1" ? go("result", { id: x.dataset.attempt }) : toast("⏳ Natijalar hali e'lon qilinmagan"));
  document.querySelectorAll("[data-test]").forEach(x => x.onclick = () => go("teacher", { id: x.dataset.test }));
  const nw = document.getElementById("new"); if (nw) nw.onclick = () => go("create");
};

function subscribeGate(channels) {
  try { tg.BackButton.hide(); } catch (e) {}

VIEWS.answer = async ({ code }) => {
  loading();
  let t; try { t = await api(`/api/test/${code}`); } catch (e) { return fail(e); }
  if (t.submitted) { return t.closed ? go("result", { id: t.submitted }, true) : done({ title: t.title, already: true }); }
  if (t.closed) return fail(new Error("Bu testning natijalari e'lon qilingan — javob qabul qilinmaydi"));
  const choices = t.items.filter(i => i.kind === "choice"), texts = t.items.filter(i => i.kind === "text");
  const draftKey = "draft-" + t.code;
  let draft = {}; try { draft = JSON.parse(store(draftKey) || "{}"); } catch (e) {}
  const answers = draft.answers || {}, written = draft.written || {};
  let variant = draft.variant || (t.variants.length === 1 ? t.variants[0] : null);
  $app.innerHTML = `<div class="view">
    <div class="hero"><span class="brand"><i>O</i>Kod ${t.code}</span><h1>${esc(t.title)}</h1><span class="muted small">${esc(t.format)}</span></div>
    <div class="card">
      <div class="field"><label for="name">Ism va familiya</label><input class="input" id="name" autocomplete="name" value="${esc(draft.name || t.last_name || "")}" placeholder="Masalan: Ali Valiyev"></div>
      ${t.variants.length > 1 ? `<div class="field"><label>Variant</label><div class="chips">${t.variants.map(v => `<button type="button" class="chip ${v === variant ? "on" : ""}" data-v="${v}">${v} variant</button>`).join("")}</div></div>` : ""}
    </div>
    <div class="sheet-progress"><div class="row between small"><b id="prog-text"></b><span class="muted" id="prog-written"></span></div><div class="track"><i id="prog"></i></div></div>
    <div class="section-title"><h2>Test savollari</h2><span class="muted small">bosib belgilang</span></div>
    ${bubbleSheet(t.items, answers)}
    ${texts.length ? `<div class="section-title"><h2>Yozma javoblar</h2><span class="muted small">${texts[0].label}–${texts[texts.length - 1].label}</span></div>
      <div class="card">${texts.map(i => `<div class="textq"><b>${i.label}</b><input class="input wq" data-q="${i.label}" value="${esc(written[i.label] || "")}" placeholder="Javob" autocomplete="off"></div>`).join("")}</div>` : ""}
    ${t.fmt === "milliy" ? `<div class="section-title"><h2>45. Esse</h2><span class="muted small">${t.ai ? "AI tekshiradi" : "o'qituvchi baholaydi"}</span></div>
      <div class="card">${t.essay_topic ? `<div class="topic">${esc(t.essay_topic)}</div>` : ""}
        <textarea class="input" id="essay" rows="9" placeholder="Kirish (2–3 jumla) · asosiy qism (kamida 3 xatboshi) · xulosa (2–3 jumla)">${esc(draft.essay || "")}</textarea>
        <div class="counter" id="essay-count"></div></div>` : ""}
    <div class="sticky-bottom"><div><button class="btn block" id="submit">Javoblarni yuborish</button></div></div>
  </div>`;
  const nameEl = document.getElementById("name"), essayEl = document.getElementById("essay");
  function save() { store(draftKey, JSON.stringify({ answers, written, variant, name: nameEl.value, essay: essayEl ? essayEl.value : "" })); }
  function progress() {
    const n = Object.keys(answers).length, w = Object.values(written).filter(x => x && x.trim()).length;
    document.getElementById("prog").style.width = (n / choices.length * 100) + "%";
    document.getElementById("prog-text").textContent = `Belgilandi: ${n} / ${choices.length}`;
    document.getElementById("prog-written").textContent = texts.length ? `Yozma: ${w} / ${texts.length}` : "";
    if (essayEl) { const words = essayEl.value.trim() ? essayEl.value.trim().split(/\s+/).length : 0; document.getElementById("essay-count").textContent = `${words} so'z · ${essayEl.value.length} belgi`; }
    save();
  }
  bindBubbles(answers, progress);
  document.querySelectorAll(".wq").forEach(x => x.oninput = () => { written[x.dataset.q] = x.value; progress(); });
  document.querySelectorAll("[data-v]").forEach(x => x.onclick = () => { variant = x.dataset.v; document.querySelectorAll("[data-v]").forEach(y => y.classList.toggle("on", y === x)); haptic("select"); save(); });
  nameEl.oninput = save; if (essayEl) essayEl.oninput = progress;
  progress();
  document.getElementById("submit").onclick = async () => {
    const name = nameEl.value.trim();
    if (name.length < 3) { toast("Ism va familiyangizni yozing"); nameEl.focus(); haptic("error"); return; }
    if (!variant) { toast("Variantni tanlang"); haptic("error"); return; }
    const missing = choices.length - Object.keys(answers).length;
    const essay = essayEl ? essayEl.value.trim() : "";
    if (essay && essay.length < 200) { toast("Esse juda qisqa — to'liq yozing yoki bo'sh qoldiring"); haptic("error"); return; }
    const warn = [missing ? `${missing} ta savol belgilanmagan` : "", t.fmt === "milliy" && !essay ? "esse yozilmagan" : ""].filter(Boolean).join(", ");
    if (!(await confirmBox(`Javoblarni yuborasizmi?${warn ? "\n\n⚠️ " + warn : ""}\n\nYuborgandan keyin o'zgartirib bo'lmaydi.`))) return;
    const btn = document.getElementById("submit"); btn.disabled = true; btn.textContent = "Yuborilmoqda…";
    try {
      await api(`/api/test/${t.code}/submit`, { variant, name, answers: { ...answers, ...written }, essay });
      store(draftKey, "{}"); S.boot = null; haptic("success");
      done({ title: t.title });
    } catch (e) { toast(e.message); haptic("error"); btn.disabled = false; btn.textContent = "Javoblarni yuborish"; }
  };
};

      const res = await api("/api/teacher/tests", { title: st.title, fmt: st.fmt, mode: st.mode, count: st.count, essay_topic: st.topic, theme: st.theme, keys: st.keys });

        toast("✅ Test yaratildi — endi o'quvchilarni qo'shing");
        return go("teacher", { id: res.id, tab: "students" });

      $app.innerHTML = `<div class="view"><div class="card success">

      document.getElementById("copy").onclick = () => { navigator.clipboard.writeText(res.code).then(() => toast("Nusxalandi"), () => toast(res.code)); };
      document.getElementById("open").onclick = () => { S.current = { view: "home", params: {} }; go("teacher", { id: res.id }); };
    } catch (e) { toast(e.message); haptic("error"); btn.disabled = false; btn.textContent = "Saqlash va PDF olish"; }

function synRow(value) {
  return `<div class="syn-row"><input class="input wk-syn" value="${esc(value)}" placeholder="Ma'nodoshi" autocomplete="off"><button type="button" class="syn-del" aria-label="Ma'nodoshni o'chirish">✕</button></div>`;
}

function itemsFor(fmt, count) {
  if (fmt !== "milliy") return Array.from({ length: count }, (_, i) => ({ label: String(i + 1), kind: "choice", options: 4 }));
  const out = [];
  for (let n = 1; n <= 35; n++) out.push({ label: String(n), kind: "choice", options: n >= 33 ? 6 : 4 });
  for (let n = 36; n <= 39; n++) out.push({ label: String(n), kind: "text" });
  for (let n = 40; n <= 44; n++) for (const p of "ab") out.push({ label: n + p, kind: "text" });
  return out;
}

async function apiForm(path, form) {
  let res;
  try { res = await fetch(path, { method: "POST", headers: { "X-Init-Data": (tg && tg.initData) || "" }, body: form }); }
  catch (e) { throw new Error("Internet aloqasi yo'q"); }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || "Xatolik yuz berdi");
  return json;
}

// Telefon surati katta (4–12 MB): yuborishdan oldin 2000 px gacha kichraytiriladi — sekin internetda ham tez
function compressImage(file, max = 2000) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); resolve(b || file); }, "image/jpeg", 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

function bindRoster(d, id) {
  const vs = d.test.variants;
  let vmode = vs.length > 1 ? "cycle" : vs[0];
  document.querySelectorAll("[data-vm]").forEach(x => x.onclick = () => { vmode = x.dataset.vm; document.querySelectorAll("[data-vm]").forEach(y => y.classList.toggle("on", y === x)); haptic("select"); });
  const add = document.getElementById("add-st");
  if (add) add.onclick = async () => {
    const names = document.getElementById("names").value.split("\n").map(x => x.trim()).filter(Boolean);
    if (!names.length) { toast("Ismlarni yozing"); return; }
    add.disabled = true;
    try { await api(`/api/teacher/test/${id}/students`, { names, mode: vmode }); haptic("success"); toast(`✅ ${names.length} ta o'quvchi qo'shildi`); render(); }
    catch (e) { toast(e.message); add.disabled = false; }
  };
  const xlsx = document.getElementById("xlsx");
  if (xlsx) xlsx.onchange = async () => {
    const file = xlsx.files[0]; if (!file) return;
    const label = document.querySelector('label[for="xlsx"]'); label.textContent = "Yuklanmoqda…";
    try {
      const form = new FormData(); form.append("file", file, file.name); form.append("mode", vmode);
      const r = await apiForm(`/api/teacher/test/${id}/students/import`, form);
      haptic("success"); toast(`✅ ${r.added} ta o'quvchi qo'shildi${r.with_variant ? ` (${r.with_variant} tasining varianti fayldan)` : ""}`); render();
    } catch (e) { toast(e.message); haptic("error"); label.textContent = "📥 Excel'dan yuklash (.xlsx, .csv)"; }
    xlsx.value = "";
  };
  document.querySelectorAll("[data-var-of]").forEach(x => x.onclick = async () => {
    const next = vs[(vs.indexOf(x.textContent.trim()) + 1) % vs.length];
    try { await api(`/api/teacher/test/${id}/students/${x.dataset.varOf}`, { variant: next }); x.textContent = next; haptic("select"); }
    catch (e) { toast(e.message); }
  });
  document.querySelectorAll("[data-del-st]").forEach(x => x.onclick = async () => {
    if (!(await confirmBox("O'quvchini ro'yxatdan o'chirasizmi? Skanerlangan natijasi ham o'chadi."))) return;
    try { await api(`/api/teacher/test/${id}/students/${x.dataset.delSt}`, { delete: true }); render(); } catch (e) { toast(e.message); }
  });
}

function showReview(r, d, allItems, box) {
  const t = d.test, milliy = t.fmt === "milliy";
  const qs = r.questions, answers = {}, warn = new Set();
  qs.forEach(q => { if (q.chosen) answers[q.label] = q.chosen; if (q.status === "multiple" || q.status === "unsure") warn.add(q.label); });
  const items = milliy ? allItems : qs.map(q => ({ label: q.label, kind: "choice", options: 4 }));
  const texts = items.filter(i => i.kind === "text");
  let variant = r.variant;
  const free = d.students.filter(s => !s.scanned);
  const who = r.student
    ? `<div class="row between"><span><b>№ ${String(r.student.number).padStart(3, "0")} · ${esc(r.student.name)}</b><br><small class="muted">${r.id_source === "bubbles" ? "o'quvchi bo'yagan ID bo'yicha topildi" : "titul kodi bo'yicha topildi"}</small></span><span class="pill-tag done">✓</span></div>
       ${r.student.scanned ? `<span class="pill-tag wait">⚠️ Avval skanerlangan — saqlasangiz almashtiriladi</span>` : ""}`
    : `${r.name_image ? `<img src="${r.name_image}" alt="Ism katagi" style="width:100%;border-radius:10px;border:1px solid var(--line)">` : ""}
       <span class="muted small">${r.id_source === "unknown" ? `⚠️ ID ${String(r.id_read).padStart(3, "0")} o'qildi, lekin ro'yxatda bunday o'quvchi yo'q — tanlang yoki ismini yozing`
         : r.id_status === "unclear" ? "⚠️ ID doirachalari noaniq bo'yalgan — o'quvchini tanlang"
         : r.code_status === "blank" ? "Bo'sh titul, ID bo'yalmagan — o'quvchini tanlang yoki ismini yozing" : "Titul kodi o'qilmadi — o'quvchini tanlang"}</span>
       ${free.length ? `<select class="input" id="pick"><option value="">— Ro'yxatdan tanlang —</option>${free.map(s => `<option value="${s.id}">№ ${s.number} · ${esc(s.name)}</option>`).join("")}</select>` : ""}
       <input class="input" id="newname" placeholder="yoki yangi o'quvchi ismi">`;
  box.innerHTML = `
    <div class="card">${who}
      <div class="field"><label>Variant ${r.variant_read ? "" : "<span class='muted'>(titulda bo'yalmagan — tanlang)</span>"}</label><div class="chips">${t.variants.map(v => `<button type="button" class="chip ${v === variant ? "on" : ""}" data-sv="${v}">${v}</button>`).join("")}</div></div></div>
    ${warn.size ? `<div class="card small" style="border:1.5px solid var(--warn)">⚠️ <b>${warn.size} ta savolni tekshiring</b> (ikkita bo'yalgan yoki xira): ${[...warn].join(", ")}</div>` : `<div class="card small">✅ Barcha doirachalar aniq o'qildi</div>`}
    <div class="section-title"><h2>Test javoblari</h2><span class="muted small">kerak bo'lsa bosib tuzating</span></div>
    ${bubbleSheet(items, answers)}
    ${texts.length ? `<div class="section-title"><h2>Yozma javoblar</h2><span class="muted small">${r.written && Object.keys(r.written).length ? "AI o'qidi — tekshiring" : ""}</span></div>
      <div class="card">${r.written_image ? `<img src="${r.written_image}" alt="Yozma kataklar" style="width:100%;border-radius:10px;border:1px solid var(--line)">` : ""}
      ${r.ai_note ? `<span class="muted small">${esc(r.ai_note)}</span>` : ""}
      ${texts.map(i => `<div class="textq"><b>${i.label}</b><input class="input wq" data-q="${i.label}" value="${esc((r.written || {})[i.label] || "")}" placeholder="Javob" autocomplete="off"></div>`).join("")}</div>` : ""}
    <button class="btn block" id="save-scan">💾 Saqlash</button>`;
  warn.forEach(l => { const row = box.querySelector(`.qrow[data-q="${l}"]`); if (row) row.style.boxShadow = "inset 3px 0 0 var(--warn)"; });

  box.querySelector("#save-scan").onclick = async () => {
    const payload = { variant, answers: { ...answers } };
    box.querySelectorAll(".wq").forEach(x => { if (x.value.trim()) payload.answers[x.dataset.q] = x.value.trim(); });

      const pick = box.querySelector("#pick"), nn = box.querySelector("#newname");

      const res = await api(`/api/teacher/test/${t.id}/scan/save`, payload);
      haptic("success");
      d.students = (await api(`/api/teacher/test/${t.id}/students`)).students;
      box.innerHTML = `<div class="card success" style="padding:20px 10px">
        <svg class="check" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><path d="M30 52 L45 66 L71 37"/></svg>
        <h2>${esc(res.name)}</h2><p class="muted" style="margin:0">${milliy ? `${num(res.points)} / ${num(res.max_points)} ball (essesiz)` : `${res.correct} / ${res.auto_total} to'g'ri`}</p>
        ${milliy ? `<label class="btn ghost block" for="essay-photo">📝 Esse varaqasini suratga olish</label><input type="file" id="essay-photo" accept="image/*" capture="environment" hidden>` : ""}
        <label class="btn block" for="photo">📷 Keyingi titul</label></div>`;
      const ep = box.querySelector("#essay-photo");
      if (ep) ep.onchange = async () => {
        const f = ep.files[0]; if (!f) return;
        const lbl = box.querySelector('label[for="essay-photo"]'); lbl.textContent = "Yuklanmoqda…";
        try { const form = new FormData(); form.append("photo", await compressImage(f, 2400), "essay.jpg"); const er = await apiForm(`/api/teacher/attempt/${res.attempt_id}/essay-photo`, form); lbl.textContent = er.status === "pending" ? "✅ Esse AI navbatida" : "✅ Esse saqlandi"; haptic("success"); }
        catch (e) { toast(e.message); lbl.textContent = "📝 Esse varaqasini suratga olish"; }
      };
      S.boot = null;
    } catch (e) { toast(e.message); haptic("error"); btn.disabled = false; btn.textContent = "💾 Saqlash"; }
  };
}

async function essaySheet(attemptId, testId) {
  let e; try { e = await api(`/api/teacher/essay/${attemptId}`); } catch (err) { return toast(err.message); }
  const modal = document.createElement("div"); modal.className = "sheet-modal";
  const crit = e.ai && e.ai.criteria ? e.ai.criteria.map(c => `<div class="crit"><b>${esc(e.titles[c.key] || c.key)}</b><span class="dots"><i class="${c.score >= 1 ? "on" : ""}"></i><i class="${c.score >= 2 ? "on" : ""}"></i></span><p>${esc(c.comment)}</p></div>`).join("") : "";
  modal.innerHTML = `<div role="dialog" aria-label="Esse">
    <div class="row between"><h2>${esc(e.name)}</h2><button class="btn plain" data-close>Yopish</button></div>
    ${e.essay != null ? `<div class="pill-tag done" style="justify-self:start">✅ Tasdiqlangan: ${num(e.essay)} / 24</div>` : ""}
    ${e.status === "graded" ? `<div class="row between"><b>🤖 AI bahosi</b><span class="bigcode" style="font-size:26px;letter-spacing:0">${num(e.ai_score)}</span></div>${crit}${e.ai.comment ? `<p class="muted small">💬 ${esc(e.ai.comment)}</p>` : ""}` : ""}
    ${e.status === "pending" ? `<p class="muted">⏳ AI hali tekshirmoqda — birozdan keyin qayta oching.</p>` : ""}
    ${e.status === "failed" ? `<p class="muted">❗️ AI baholay olmadi: ${esc(e.error || "")}</p>` : ""}
    ${e.status === "none" ? `<p class="muted">➖ O'quvchi esse yubormagan.</p>` : ""}
    ${e.text ? `<details><summary class="small"><b>Esse matni</b></summary><p style="white-space:pre-wrap;font-size:14px">${esc(e.text)}</p></details>` : e.photos ? `<p class="muted small">📷 Esse ${e.photos} ta rasm ko'rinishida yuborilgan.</p>` : ""}
    ${e.status === "graded" ? `<button class="btn block" data-act="confirm">✅ AI bahosini tasdiqlash (${num(e.ai_score)})</button>` : ""}
    ${e.status === "failed" ? `<button class="btn ghost block" data-act="retry">🔁 AI'da qayta tekshirish</button>` : ""}
    <div class="row"><input class="input" id="manual" inputmode="decimal" placeholder="O'z bahoyingiz: 0–24, masalan 18,5"><button class="btn ghost" data-act="score">Saqlash</button></div>
  </div>`;
  document.body.appendChild(modal);
  const close = () => modal.remove();
  modal.onclick = ev => { if (ev.target === modal || ev.target.closest("[data-close]")) close(); };
  modal.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const action = b.dataset.act, payload = { action };
    if (action === "score") payload.score = document.getElementById("manual").value;
    try { await api(`/api/teacher/essay/${attemptId}`, payload); haptic("success"); toast(action === "retry" ? "🔁 Navbatga qo'yildi" : "✅ Saqlandi"); close(); render(); }
    catch (err) { toast(err.message); haptic("error"); }
  });
}

// ---------- Ishga tushirish ----------
(function init() {
  if (tg) {
    try { tg.ready(); tg.expand(); if (tg.colorScheme === "dark") document.documentElement.classList.add("dark"); tg.onEvent("themeChanged", () => document.documentElement.classList.toggle("dark", tg.colorScheme === "dark")); } catch (e) {}
  }
  if (!tg || !tg.initData) {
    $app.innerHTML = `<div class="view"><div class="card empty"><div class="big">📱</div><b>Ilovani Telegram ichida oching</b><span>Botdagi «Ochish» tugmasini bosing.</span></div></div>`;
    return;
  }
  const q = new URLSearchParams(location.search);
  S.current = { view: "home", params: {} };
  if (q.get("r")) { S.stack = []; go("result", { id: q.get("r") }); }
  else if (q.get("t")) { S.role = "teacher"; go("teacher", { id: q.get("t"), tab: q.get("tab") || undefined }); }
  else if (q.get("v") === "create") { S.role = "teacher"; go("create"); }
  else if (q.get("c")) { go("answer", { code: q.get("c") }); }
  else render();
})();
</script>

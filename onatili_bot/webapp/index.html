  function resume() {
    review.innerHTML = ""; still.hidden = true; video.hidden = false; cam.classList.remove("got"); drawQuad(null);
    const c = document.getElementById("scan-count"); if (c && d.students.length) c.textContent = count();
    window.scrollTo({ top: 0, behavior: "smooth" });
    startLoop(true);
  }

  let loopToken = 0;
  function stopLoop() { loopToken++; S.scanLoop = null; }

  // Kadrlar telefonning o'zida o'qiladi (omr.js, Chittak skaneri): ramka darhol chiziladi, internet kerak emas.
  // Ketma-ket ikki kadr bir xil o'qilsa — varaq qimirlamay turibdi: natija shu zahoti telefon xotirasiga
  // yoziladi (yozma kataklar va ism katagi rasmi bilan). Telefon buni qo'llamasa — server sikli (startServerLoop)
  // Titul o'lchami: standart — A4; ixcham — A4 ning 1/3 yoki 1/2 qismi; EvalBee/DTM — o'z bo'yi
  if (local) { SHEET_PAGE = sheetPageOf(layout); READ_SCALE = SHEET_PAGE.readScale; }
  let worker = local ? createScanWorker() : null;
  if (worker) worker.postMessage({ layout, page: 1, sheetPage: SHEET_PAGE });
  S.stopWorker = () => stopWorker();
  const stopWorker = () => { if (worker) { worker.terminate(); URL.revokeObjectURL(worker.url); worker = null; } };
  // Imzo: kod | ID | javoblar. Keyingi titul ustiga qo'yilsa — imzo o'zgaradi va u ham ushlanadi
  const signature = r => `${r.sheet_code ?? "-"}|${r.sheet_number ?? "-"}|${r.questions.map(q => q.chosen || "-").join(".")}`;
  const isNewSheet = (a, b) => {
    if (!b) return true;
    const [ca, na, xa] = a.split("|"), [cb, nb, xb] = b.split("|");
    if ((ca !== "-" && cb !== "-" && ca !== cb) || (na !== "-" && nb !== "-" && na !== nb)) return true;
    const qa = xa.split("."), qb = xb.split(".");
    let diff = 0;
    for (let i = 0; i < Math.max(qa.length, qb.length); i++) if (qa[i] !== qb[i]) diff++;
    return diff >= 3;  // bitta-ikkita xira doiracha — o'sha varaqning o'zi
  };
  const analyze = () => new Promise(resolve => {
    if (!worker) { try { resolve(analyzeFrame(video, video.videoWidth, video.videoHeight, { edgeMarks: true, layout, page: 1 })); } catch (e) { resolve(null); } return; }
    const w = worker;
    w.onmessage = ({ data }) => resolve(data.error ? null : data);
    createImageBitmap(video).then(bitmap => w.postMessage({ bitmap, edgeMarks: true, skipRead: false }, [bitmap]))
      .catch(() => { stopWorker(); resolve(analyzeFrame(video, video.videoWidth, video.videoHeight, { edgeMarks: true, layout, page: 1 })); });
  });

  let swapSig = null, savedText = "", phase = "titul", queue = [];
  const idleText = () => savedText ? `${savedText} · keyingisini qo'ying` : "Titulni ramkaga to'liq sig'diring";

  async function startLoop(waitSwap = false) {
    if (!local) return startServerLoop(waitSwap);
    if (phase === "essay") return;  // esse sahifasi kutilmoqda — «Keyingi titul» bosilganda davom etadi
    const my = ++loopToken; S.scanLoop = my;
    let last = null;
    setStatus(idleText(), savedText ? "ok" : "");
    while (my === loopToken && S.camera && document.body.contains(video)) {
      if (!video.videoWidth) { await new Promise(r => setTimeout(r, 200)); continue; }
      const started = performance.now();
      const a = await analyze();
      if (my !== loopToken) return;
      const corners = a && a.corners;
      drawQuad(corners ? corners.map(c => [c.x / a.width, c.y / a.height]) : null);
      if (!corners) { waitSwap = false; last = null; setStatus(idleText(), savedText ? "ok" : ""); }
      else if (!a.read) { last = null; if (!waitSwap) setStatus("Telefonni qimirlatmang…"); }
      else {
        const sig = signature(a.read.result);
        if (waitSwap && !isNewSheet(sig, swapSig)) last = null;  // hali o'sha varaq turibdi
        else if (sig === last) {  // barqaror — telefonga saqlaymiz
          try { await keep(a); }
          catch (e) { setStatus("Saqlab bo'lmadi: " + e.message, "bad"); await new Promise(r => setTimeout(r, 1200)); last = null; continue; }
          if (my !== loopToken || phase === "essay") return;
          waitSwap = true; swapSig = sig; last = null;
        } else { waitSwap = false; last = sig; setStatus("Telefonni qimirlatmang…"); }
      }
      // Telefon qizib ketmasin: o'qish vaqtining bir qismicha dam (titul tez ushlanishi uchun qisqa)
      await new Promise(r => setTimeout(r, Math.max(30, (performance.now() - started) * 0.35)));
    }
  }

  // Ushlangan titul → telefon xotirasi. O'quvchi titul kodidan yoki bo'yalgan ID'dan aniqlanadi
  async function keep(a) {
    const res = a.read.result;
    const code = decodeSheetNumber(res.sheet_code);
    let number = code || null, idSource = code ? "code" : null;
    if (!number && res.sheet_number_status === "ok") { number = res.sheet_number; idSource = "bubbles"; }
    const student = number ? d.students.find(s => s.number === number) || null : null;
    if (number && !student) idSource = "unknown";
    const variant = res.variant || (student && student.variant) || (t.variants.length === 1 ? t.variants[0] : null);
    const needWritten = (layout.written_labels || []).length > 0;
    const [written, name] = await Promise.all([
      needWritten ? cropSheet(a.read.sheet, layout.written_area, READ_SCALE) : null,
      student ? null : cropSheet(a.read.sheet, layout.name_area, READ_SCALE, 0.8),
    ]);
    const rec = {
      uid: newUid(), testId: testKey, created: Date.now(), payload: null, written, name, essays: [], error: null,
      r: {
        student: student ? { ...student } : null, id_source: idSource, id_read: number, id_status: res.sheet_number_status,
        code_status: student ? "ok" : (res.sheet_code === 0 ? "blank" : "unclear"), variant, variant_read: res.variant,
        questions: res.questions.map(q => ({ label: q.label, chosen: q.chosen, status: q.status })),
      },
    };
    // Shu o'quvchi avval ham skanerlangan bo'lsa — eskisi o'rniga yangisi
    let replaced = false;
    if (student) for (const old of queue) if (recPayload(old).student_id === student.id) { await scanDB.del(old.uid); replaced = true; }
    await scanDB.put(rec);
    haptic("success");
    cam.classList.add("got"); setTimeout(() => cam.classList.remove("got"), 500);
    const warn = recWarnings(rec);
    savedText = `✅ ${student ? `№ ${pad3(student.number)} ${student.name}` : "Titul"} saqlandi${replaced ? " (yangilandi)" : ""}${warn ? ` · ⚠️ ${warn}` : ""}`;
    setStatus(savedText, "ok");
    await refreshQueue();
    if (milliy && essayMode) enterEssay(rec);
  }

  // ---------- Telefondagi titullar ro'yxati va yuborish ----------
  const qList = document.getElementById("q-list"), qSend = document.getElementById("q-send"), qCount = document.getElementById("q-count");
  let sending = false;
  function whoOf(rec) {
    const p = recPayload(rec);
    const st = p.student_id ? d.students.find(s => s.id === p.student_id) || (rec.r.student && rec.r.student.id === p.student_id ? rec.r.student : null) : null;
    return st ? `№ ${pad3(st.number)} · ${esc(st.name)}` : p.name ? esc(p.name) : "❗ O'quvchi aniqlanmadi — bosib tanlang";
  }
  async function refreshQueue() {
    if (!local) return;
    queue = await scanDB.all(testKey);
    qCount.textContent = queue.length;
    qList.innerHTML = queue.slice().reverse().map((rec, i) => {
      const p = recPayload(rec), ready = recReady(rec), warn = recWarnings(rec);
      const tags = [p.variant ? `${p.variant} variant` : "❗ variant tanlanmagan", warn ? `⚠️ ${warn} ta savolni tekshiring` : "",
        rec.essays.length ? `📝 esse: ${rec.essays.length} bet` : "", rec.payload ? "✏️ tuzatilgan" : "", rec.error ? `❗ ${esc(rec.error)}` : ""].filter(Boolean).join(" · ");
      return `<button type="button" class="item" data-rec="${rec.uid}"><span class="rank">${queue.length - i}</span>
        <span><b>${whoOf(rec)}</b><small>${tags}</small></span><span class="pill-tag ${ready && !warn && !rec.error ? "done" : "wait"}">${ready ? (warn || rec.error ? "!" : "✓") : "?"}</span></button>`;
    }).join("");
    qList.querySelectorAll("[data-rec]").forEach(el => el.onclick = () => { const rec = queue.find(x => x.uid === el.dataset.rec); if (rec) openRec(rec); });
    if (!sending) { qSend.disabled = !queue.length; qSend.textContent = queue.length ? `📤 Botga yuborish (${queue.length} ta)` : "📤 Botga yuborish"; }
  }

  // Ro'yxatdagi titulni ochib tekshirish/tuzatish (skaner shu vaqtda to'xtab turadi)
  function openRec(rec) {
    if (sending) return;
    stopLoop(); drawQuad(null);
    const p = recPayload(rec), labels = layout.written_labels || [];
    const urls = [rec.written, rec.name].map(b => b ? URL.createObjectURL(b) : null);
    const student = p.student_id ? d.students.find(s => s.id === p.student_id) || rec.r.student : null;
    const r = {
      ...rec.r, student, variant: p.variant, prefill_name: p.name || "",
      questions: rec.r.questions.map(q => ({ ...q, chosen: p.answers[q.label] || "", status: rec.payload ? "ok" : q.status })),
      written: Object.fromEntries(labels.filter(l => p.answers[l]).map(l => [l, p.answers[l]])),
      written_image: urls[0], name_image: student ? null : urls[1],
      ai_note: layout.ai ? "Yozma javoblarni botga yuborilgach AI o'qiydi. Xohlasangiz o'zingiz yozing — siz yozgani ustun turadi."
        : "AI o'chiq — yozma javoblarni rasmga qarab o'zingiz yozing.",
    };
    const close = () => { urls.forEach(u => u && URL.revokeObjectURL(u)); review.innerHTML = ""; window.scrollTo({ top: 0, behavior: "smooth" }); startLoop(true); };
    showReview(r, d, items, review, close, {
      save: async payload => { rec.payload = payload; rec.error = null; await scanDB.put(rec); await refreshQueue(); },
      remove: async () => { await scanDB.del(rec.uid); await refreshQueue(); },
    });
    review.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  async function sendAll() {
    const list = await scanDB.all(testKey);
    if (!list.length) return;
    const bad = list.filter(rec => !recReady(rec));
    if (bad.length) { haptic("error"); toast(`${bad.length} ta titulda o'quvchi yoki variant tanlanmagan — tuzating`); return openRec(bad[0]); }
    sending = true; stopLoop(); qSend.disabled = true;
    let saved = 0, failed = 0, written = 0, essays = 0, offline = false;
    for (const [index, rec] of list.entries()) {
      qSend.textContent = `Yuborilmoqda… ${index + 1} / ${list.length}`;
      try {
        const form = new FormData();
        form.append("data", JSON.stringify({ ...recPayload(rec), uid: rec.uid, written_mime: "image/jpeg" }));
        if (rec.written) form.append("written", rec.written, "yozma.jpg");
        rec.essays.forEach((blob, i) => form.append("essay", blob, `esse-${i + 1}.jpg`));
        const res = await apiForm(`/api/teacher/test/${id}/scan/upload`, form);
        saved++; if (res.written_queued) written++; if (rec.essays.length) essays++;
        await scanDB.del(rec.uid);
      } catch (e) {
        failed++;
        if (e.message === "Internet aloqasi yo'q") { offline = true; failed = list.length - saved; break; }
        rec.error = e.message; await scanDB.put(rec);
      }
    }
    if (saved) {
      try { await api(`/api/teacher/test/${id}/scan/upload/done`, { saved, written, essays, failed }); } catch (e) {}
      try { d.students = (await api(`/api/teacher/test/${id}/students`)).students; } catch (e) {}
      const c = document.getElementById("scan-count"); if (c && d.students.length) c.textContent = count();
      S.boot = null;
    }
    sending = false; savedText = "";
    await refreshQueue();
    if (offline) { haptic("error"); toast(saved ? `✅ ${saved} ta yuborildi. Internet uzildi — qolganini keyinroq yuboring` : "Internet yo'q — titullar telefonda saqlanib turibdi, keyinroq yuboring"); }
    else if (failed) { haptic("warning"); toast(`✅ ${saved} ta yuborildi, ❗ ${failed} tasida xato — ro'yxatda ko'ring`); }
    else { haptic("success"); toast(`✅ ${saved} ta titul botga yuborildi${written ? " — yozma javoblarni AI o'qimoqda" : ""}`); }
    if (!review.innerHTML) startLoop();
  }

  // Esse varaqasi: titul saqlangach (o'qituvchi «📝 Esse ham»ni yoqqan bo'lsa) shu o'quvchiga biriktiriladi
  let essayRec = null;
  const essayBar = document.getElementById("essay-bar");
  function essayInfo() {
    const n = essayRec ? essayRec.essays.length : 0;
    document.getElementById("essay-who").innerHTML = `📝 Esse varaqasi · ${essayRec ? whoOf(essayRec) : ""}`;
    document.getElementById("essay-info").textContent = n ? `✅ ${n} bet saqlandi. Yana bet bo'lsa — suratga oling, bo'lmasa «Keyingi titul».`
      : "Esse varaqasini kameraga to'liq ko'rsating va «📸 Suratga olish»ni bosing. Bir necha bet bo'lsa — har birini.";
  }
  function enterEssay(rec) {
    phase = "essay"; essayRec = rec; stopLoop(); drawQuad(null);
    essayBar.hidden = false; essayInfo();
    setStatus("📝 Endi esse varaqasini ko'rsating", "ok");
  }
  function leaveEssay() { phase = "titul"; essayRec = null; if (essayBar) essayBar.hidden = true; startLoop(true); }
  if (essayBar) {
    document.getElementById("essay-shot").onclick = async () => {
      if (!essayRec || !video.videoWidth) return;
      const blob = await frameJpeg(video);
      if (!blob) return toast("Suratga olib bo'lmadi");
      essayRec.essays.push(blob);
      try { await scanDB.put(essayRec); } catch (e) { essayRec.essays.pop(); return toast("Saqlab bo'lmadi: " + e.message); }
      haptic("success"); cam.classList.add("got"); setTimeout(() => cam.classList.remove("got"), 400);
      essayInfo(); refreshQueue();
    };
    document.getElementById("essay-next").onclick = () => { haptic("light"); leaveEssay(); };
  }
  const essayToggle = document.getElementById("essay-mode");
  if (essayToggle) essayToggle.onclick = () => {
    essayMode = !essayMode; store("scanEssay", essayMode ? "1" : "0"); essayToggle.classList.toggle("on", essayMode); haptic("select");
    toast(essayMode ? "📝 Har tituldan keyin esse varaqasini ham suratga olasiz" : "Faqat titullar skanerlanadi");
    if (!essayMode && phase === "essay") leaveEssay();
  };
  if (qSend) qSend.onclick = () => sendAll();
  if (local) {
    refreshQueue();
    scanDB.persistent().then(ok => { if (!ok) document.getElementById("q-hint").textContent = "⚠️ Bu telefonda xotiraga yozib bo'lmadi: sahifani yopsangiz titullar o'chadi. Skanerlab bo'lgach darhol yuboring."; });
  }
  // Zaxira: har kadr serverda o'qiladi (?live=1).
  // waitSwap — «Keyingi titul»dan keyin: kamera oldida hali eski varaq turadi, u kadrdan chiqmaguncha qayta ushlanmaydi
  async function startServerLoop(waitSwap = false) {
    const my = ++loopToken; S.scanLoop = my;
    setStatus(waitSwap ? "Keyingi titulni qo'ying" : "Titulni ramkaga to'liq sig'diring");
    while (my === loopToken && S.camera && document.body.contains(video)) {
      if (!video.videoWidth) { await new Promise(r => setTimeout(r, 200)); continue; }
      const frame = await frameBlob(video);
      try {
        const form = new FormData(); form.append("photo", frame.blob, "kadr.jpg");
        const r = await apiForm(`/api/teacher/test/${id}/scan?live=1`, form);
        if (my !== loopToken) return;
        if (r.found && waitSwap) { drawQuad(r.corners); setStatus("Keyingi titulni qo'ying"); continue; }
        if (r.found) { drawQuad(r.corners); return captured(r, frame); }
        waitSwap = false;
        drawQuad(null); setStatus(r.hint && r.hint.includes("kichik") ? "Yaqinroq keling" : "Titulni ramkaga to'liq sig'diring");
      } catch (e) {
        if (my !== loopToken) return;
        setStatus(e.message, "bad"); await new Promise(r => setTimeout(r, 1500));
      }
    }
  }

  function showFallback(message) {
    cam.hidden = true; document.getElementById("cam-tip").hidden = true;
    document.getElementById("fallback").hidden = false;
    document.getElementById("cam-error").textContent = message;
  }

  // Zaxira: oddiy surat
  const input = document.getElementById("photo");
  input.onchange = async () => {
    const file = input.files[0]; if (!file) return;
    review.innerHTML = `<div class="card empty"><div class="big">🔍</div><b>Skanerlanmoqda…</b><span>Bir necha soniya</span></div>`;
    try {
      const form = new FormData(); form.append("photo", await compressImage(file), "titul.jpg");
      const r = await apiForm(`/api/teacher/test/${id}/scan`, form);
      haptic("success"); showReview(r, d, items, review, () => { review.innerHTML = ""; input.click(); });
    } catch (e) {
      haptic("error");
      review.innerHTML = `<div class="card empty"><div class="big">📷</div><b>${esc(e.message)}</b><span>Qaytadan suratga oling.</span></div>`;
    }
    input.value = "";
  };

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return showFallback("Bu qurilmada Telegram ichida jonli kamera ishlamaydi — suratga olib yuboring.");
  try {
    S.camera = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) {
    return showFallback(e.name === "NotAllowedError" ? "Kameraga ruxsat berilmadi. Telegram sozlamalarida kameraga ruxsat bering yoki suratga olib yuboring." : "Kamerani ochib bo'lmadi — suratga olib yuboring.");
  }
  if (!document.body.contains(video)) return stopCamera();  // kutayotganda boshqa sahifaga o'tildi
  video.srcObject = S.camera;
  video.onloadedmetadata = () => { cam.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`; };
  const track = S.camera.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (caps.torch) {
    let on = false; const tb = document.getElementById("torch"); tb.hidden = false;
    tb.onclick = async () => { on = !on; try { await track.applyConstraints({ advanced: [{ torch: on }] }); tb.classList.toggle("on", on); } catch (e) { on = !on; } };
  }
  startLoop();
};

// local — oflayn skanerdagi (telefonda saqlangan) titul: { save(payload), remove() } — server o'rniga telefonga yoziladi
function showReview(r, d, allItems, box, onNext, local = null) {
  const t = d.test, milliy = t.fmt === "milliy";
  const qs = r.questions, answers = {}, warn = new Set();
  qs.forEach(q => { if (q.chosen) answers[q.label] = q.chosen; if (q.status === "multiple" || q.status === "unsure") warn.add(q.label); });
  const items = milliy ? allItems : qs.map(q => ({ label: q.label, kind: "choice", options: 4 }));
  const texts = items.filter(i => i.kind === "text");
  let variant = r.variant;
  const free = d.students.filter(s => !s.scanned);
  const who = r.student
    ? `<div class="row between"><span><b>№ ${String(r.student.number).padStart(3, "0")} · ${esc(r.student.name)}</b><br><small class="muted">${r.id_source === "bubbles" ? "o'quvchi bo'yagan ID bo'yicha topildi" : "titul kodi bo'yicha topildi"}</small></span><span class="pill-tag done">✓</span></div>
       ${r.student.scanned ? `<span class="pill-tag wait">⚠️ Avval skanerlangan — saqlasangiz almashtiriladi</span>` : ""}`
    : `${r.name_image ? `<img src="${r.name_image}" alt="Ism katagi" style="width:100%;border-radius:10px;border:1px solid var(--line)">` : ""}
       <span class="muted small">${r.id_source === "unknown" ? `⚠️ ID ${String(r.id_read).padStart(3, "0")} o'qildi, lekin ro'yxatda bunday o'quvchi yo'q — tanlang yoki ismini yozing`
         : r.id_status === "unclear" ? "⚠️ ID doirachalari noaniq bo'yalgan — o'quvchini tanlang"
         : r.code_status === "blank" ? "Bo'sh titul, ID bo'yalmagan — o'quvchini tanlang yoki ismini yozing" : "Titul kodi o'qilmadi — o'quvchini tanlang"}</span>
       ${free.length ? `<select class="input" id="pick"><option value="">— Ro'yxatdan tanlang —</option>${free.map(s => `<option value="${s.id}">№ ${s.number} · ${esc(s.name)}</option>`).join("")}</select>` : ""}
       <input class="input" id="newname" placeholder="yoki yangi o'quvchi ismi" value="${esc(r.prefill_name || "")}">`;
  box.innerHTML = `
    <div class="card">${who}
      ${t.variants.length > 1 ? `<div class="field"><label>Variant ${r.variant_read ? "" : "<span class='muted'>(titulda bo'yalmagan — tanlang)</span>"}</label><div class="chips">${t.variants.map(v => `<button type="button" class="chip ${v === variant ? "on" : ""}" data-sv="${v}">${v}</button>`).join("")}</div></div>` : ""}</div>
    ${warn.size ? `<div class="card small" style="border:1.5px solid var(--warn)">⚠️ <b>${warn.size} ta savolni tekshiring</b> (ikkita bo'yalgan yoki xira): ${[...warn].join(", ")}</div>` : `<div class="card small">✅ Barcha doirachalar aniq o'qildi</div>`}
    <div class="section-title"><h2>Test javoblari</h2><span class="muted small">kerak bo'lsa bosib tuzating</span></div>
    ${bubbleSheet(items, answers)}
    ${texts.length ? `<div class="section-title"><h2>Yozma javoblar</h2><span class="muted small">${r.written && Object.keys(r.written).length ? "AI o'qidi — tekshiring" : ""}</span></div>
      <div class="card">${r.written_image ? `<img src="${r.written_image}" alt="Yozma kataklar" style="width:100%;border-radius:10px;border:1px solid var(--line)">` : ""}
      ${r.ai_note ? `<span class="muted small">${esc(r.ai_note)}</span>` : ""}
      ${texts.map(i => `<div class="textq"><b>${i.label}</b><input class="input wq" data-q="${i.label}" value="${esc((r.written || {})[i.label] || "")}" placeholder="Javob" autocomplete="off"></div>`).join("")}</div>` : ""}
    <button class="btn block" id="save-scan">💾 Saqlash</button>
    ${local ? `<div class="row" style="gap:8px"><button type="button" class="btn ghost" id="close-scan" style="flex:1">Yopish</button><button type="button" class="btn ghost" id="del-scan" style="flex:1">🗑 O'chirish</button></div>` : ""}`;
  if (local) {
    box.querySelector("#close-scan").onclick = () => { haptic("light"); onNext(); };
    box.querySelector("#del-scan").onclick = async () => {
      if (!(await confirmBox("Bu titulni telefondan o'chirasizmi?"))) return;
      await local.remove(); haptic("success"); toast("🗑 O'chirildi"); onNext();
    };
  }
  warn.forEach(l => { const row = box.querySelector(`.qrow[data-q="${l}"]`); if (row) row.style.boxShadow = "inset 3px 0 0 var(--warn)"; });
  bindBubbles(answers);
  box.querySelectorAll("[data-sv]").forEach(x => x.onclick = () => { variant = x.dataset.sv; box.querySelectorAll("[data-sv]").forEach(y => y.classList.toggle("on", y === x)); haptic("select"); });
  box.querySelector("#save-scan").onclick = async () => {
    const payload = { variant, answers: { ...answers } };
    box.querySelectorAll(".wq").forEach(x => { if (x.value.trim()) payload.answers[x.dataset.q] = x.value.trim(); });
    if (r.student) payload.student_id = r.student.id;
    else {
      const pick = box.querySelector("#pick"), nn = box.querySelector("#newname");
      if (pick && pick.value) payload.student_id = +pick.value; else payload.name = nn ? nn.value.trim() : "";
      if (!payload.student_id && (!payload.name || payload.name.length < 3)) { toast("O'quvchini tanlang yoki ismini yozing"); haptic("error"); return; }
    }
    if (!variant) { toast("Variantni tanlang"); haptic("error"); return; }
    const btn = box.querySelector("#save-scan"); btn.disabled = true; btn.textContent = "Saqlanmoqda…";
    if (local) {  // telefonga — botga keyin «Botga yuborish» bilan ketadi
      try { await local.save(payload); haptic("success"); toast("✅ Saqlandi (telefonda)"); onNext(); }
      catch (e) { toast(e.message); haptic("error"); btn.disabled = false; btn.textContent = "💾 Saqlash"; }
      return;
    }
    try {
      const res = await api(`/api/teacher/test/${t.id}/scan/save`, payload);
      haptic("success");
      d.students = (await api(`/api/teacher/test/${t.id}/students`)).students;
      box.innerHTML = `<div class="card success" style="padding:20px 10px">
        <svg class="check" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><path d="M30 52 L45 66 L71 37"/></svg>
        <h2>${esc(res.name)}</h2><p class="muted" style="margin:0">${milliy ? `${num(res.points)} / ${num(res.max_points)} ball (essesiz)` : `${res.correct} / ${res.auto_total} to'g'ri`}</p>
        ${milliy ? `<label class="btn ghost block" for="essay-photo">📝 Esse varaqasini suratga olish</label><input type="file" id="essay-photo" accept="image/*" capture="environment" hidden>` : ""}
        <button class="btn block" id="next-sheet">📷 Keyingi titul</button></div>`;
      box.querySelector("#next-sheet").onclick = () => { haptic("light"); onNext(); };
      const ep = box.querySelector("#essay-photo");
      if (ep) ep.onchange = async () => {
        const f = ep.files[0]; if (!f) return;
        const lbl = box.querySelector('label[for="essay-photo"]'); lbl.textContent = "Yuklanmoqda…";
        try { const form = new FormData(); form.append("photo", await compressImage(f, 2400), "essay.jpg"); const er = await apiForm(`/api/teacher/attempt/${res.attempt_id}/essay-photo`, form); lbl.textContent = er.status === "pending" ? "✅ Esse AI navbatida" : "✅ Esse saqlandi"; haptic("success"); }
        catch (e) { toast(e.message); lbl.textContent = "📝 Esse varaqasini suratga olish"; }
      };
      S.boot = null;
    } catch (e) { toast(e.message); haptic("error"); btn.disabled = false; btn.textContent = "💾 Saqlash"; }
  };
}

async function essaySheet(attemptId, testId) {
  let e; try { e = await api(`/api/teacher/essay/${attemptId}`); } catch (err) { return toast(err.message); }
  const modal = document.createElement("div"); modal.className = "sheet-modal";
  const crit = e.ai && e.ai.criteria ? e.ai.criteria.map(c => `<div class="crit"><b>${esc(e.titles[c.key] || c.key)}</b><span class="dots"><i class="${c.score >= 1 ? "on" : ""}"></i><i class="${c.score >= 2 ? "on" : ""}"></i></span><p>${esc(c.comment)}</p></div>`).join("") : "";
  modal.innerHTML = `<div role="dialog" aria-label="Esse">
    <div class="row between"><h2>${esc(e.name)}</h2><button class="btn plain" data-close>Yopish</button></div>
    ${e.essay != null ? `<div class="pill-tag done" style="justify-self:start">✅ Tasdiqlangan: ${num(e.essay)} / 24</div>` : ""}
    ${e.status === "graded" ? `<div class="row between"><b>🤖 AI bahosi</b><span class="bigcode" style="font-size:26px;letter-spacing:0">${num(e.ai_score)}</span></div>${crit}${e.ai.comment ? `<p class="muted small">💬 ${esc(e.ai.comment)}</p>` : ""}` : ""}
    ${e.status === "pending" ? `<p class="muted">⏳ AI hali tekshirmoqda — birozdan keyin qayta oching.</p>` : ""}
    ${e.status === "failed" ? `<p class="muted">❗️ AI baholay olmadi: ${esc(e.error || "")}</p>` : ""}
    ${e.status === "none" ? `<p class="muted">➖ O'quvchi esse yubormagan.</p>` : ""}
    ${e.text ? `<details><summary class="small"><b>Esse matni</b></summary><p style="white-space:pre-wrap;font-size:14px">${esc(e.text)}</p></details>` : e.photos ? `<p class="muted small">📷 Esse ${e.photos} ta rasm ko'rinishida yuborilgan.</p>` : ""}
    ${e.status === "graded" ? `<button class="btn block" data-act="confirm">✅ AI bahosini tasdiqlash (${num(e.ai_score)})</button>` : ""}
    ${e.status === "failed" ? `<button class="btn ghost block" data-act="retry">🔁 AI'da qayta tekshirish</button>` : ""}
    <div class="row"><input class="input" id="manual" inputmode="decimal" placeholder="O'z bahoyingiz: 0–24, masalan 18,5"><button class="btn ghost" data-act="score">Saqlash</button></div>
  </div>`;
  document.body.appendChild(modal);
  const close = () => modal.remove();
  modal.onclick = ev => { if (ev.target === modal || ev.target.closest("[data-close]")) close(); };
  modal.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const action = b.dataset.act, payload = { action };
    if (action === "score") payload.score = document.getElementById("manual").value;
    try { await api(`/api/teacher/essay/${attemptId}`, payload); haptic("success"); toast(action === "retry" ? "🔁 Navbatga qo'yildi" : "✅ Saqlandi"); close(); rerender(); }
    catch (err) { toast(err.message); haptic("error"); }
  });
}

async function pollLogin(token) {
  const my = S.loginPoll = (S.loginPoll || 0) + 1;
  for (let i = 0; i < 300 && my === S.loginPoll && S.loginToken === token; i++) {
    try {
      const r = await api(`/api/app/login/${token}`);
      if (r.ready) {
        store("appSession", r.session); S.loginToken = null; S.boot = null; haptic("success");
        toast(`✅ Xush kelibsiz, ${(r.user && r.user.name) || ""}`);
        S.stack = []; S.current = { view: "home", params: {} }; return render();
      }
    } catch (e) {}
    await new Promise(res => setTimeout(res, 2000));
  }
}

(function init() {
  if (tg) {
    try { tg.ready(); tg.expand(); if (tg.colorScheme === "dark") document.documentElement.classList.add("dark"); tg.onEvent("themeChanged", () => document.documentElement.classList.toggle("dark", tg.colorScheme === "dark")); } catch (e) {}
  }
  if ((!tg || !tg.initData) && APP) { appStart(new URLSearchParams(location.search)); return; }
  if (!tg || !tg.initData) {
    $app.innerHTML = `<div class="view"><div class="card empty"><div class="big">📱</div><b>Ilovani Telegram ichida oching</b><span>Botdagi «Ochish» tugmasini bosing.</span></div></div>`;
    return;
  }
  const q = new URLSearchParams(location.search);
  S.current = { view: "home", params: {} };
  if (q.get("r")) { S.stack = []; go("result", { id: q.get("r") }); }
  else if (q.get("t")) { S.role = "teacher"; go("teacher", { id: q.get("t"), tab: q.get("tab") || undefined }); }
  else if (q.get("v") === "create") { S.role = "teacher"; go("create"); }
  else if (q.get("c")) { go("answer", { code: q.get("c") }); }
  else render();
})();
</script>
</body>
</html>
